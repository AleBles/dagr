      nl: Lijsten
    switch:
      en: Use lists
      nl: Lijsten gebruiken
    switch_sub:
      en: A sidebar of lists, and @list when adding a task
      nl: Een zijbalk met lijsten, en @lijst bij het toevoegen van een taak
    desc:
      en: Add, rename, reorder and remove lists in the sidebar.
      nl: Lijsten toevoegen, hernoemen, herordenen en verwijderen doe je in de zijbalk.
    default:
      en: Default list
      nl: Standaardlijst
    default_sub:
      en: Where a task goes when no single list is showing
      nl: Waar een taak heen gaat als er geen enkele lijst getoond wordt
    open_on:
      en: Open on
      nl: Openen op
  open_on:
    last_used:
      en: The list last shown
      nl: De laatst getoonde lijst
    default_list:
      en: The default list
      nl: De standaardlijst
    all_tasks:
      en: All tasks
      nl: Alle taken
  ai:
    title:
      en: AI access
      nl: AI-toegang
    switch:
