      nl: Kon niet starten

about:
  comments:
    en: |-
      A simple, priority-ordered task list.

      Shortcuts: Ctrl+N focus the entry, Ctrl+Shift+D clear completed, Ctrl+, preferences (Ctrl+1…Ctrl+5 switch its pages), Ctrl+Q quit.
    nl: |-
      Een eenvoudige, op prioriteit geordende takenlijst.

      Sneltoetsen: Ctrl+N naar het invoerveld, Ctrl+Shift+D voltooide wissen, Ctrl+, voorkeuren (Ctrl+1…Ctrl+5 wisselt van pagina), Ctrl+Q afsluiten.
