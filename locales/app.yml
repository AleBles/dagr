# Every user-facing string in Dagr, English and Dutch side by side. Strings an
# AI assistant reads (MCP tool descriptions, API errors) are deliberately not
# in here: those are an interface contract, and stay English. So does the
# terminal output of `dagr serve` and friends.
_version: 2

seed:
  list:
    en: Tasks
    nl: Taken
  priority:
    high:
      en: High
      nl: Hoog
    medium:
      en: Medium
      nl: Middel
    low:
      en: Low
      nl: Laag
    none:
      en: None
      nl: Geen

entry:
  placeholder:
    en: Add a task…
    nl: Voeg een taak toe…
  add:
    en: Add task
    nl: Taak toevoegen
  hint:
    base:
      en: Press Enter to add.
      nl: Druk op Enter om toe te voegen.
    priorities:
      en: Each leading ! raises the priority one level above the default.
      nl: Elke ! vooraan verhoogt de prioriteit één niveau boven de standaard.
    labels:
      en: Each leading #tag adds a label.
      nl: Elke #tag vooraan voegt een label toe.
    lists:
      en: A leading @list files it in that list.
      nl: Een @lijst vooraan zet de taak in die lijst.

empty:
  title:
    en: No tasks
    nl: Geen taken
  body:
    en: Type above and press Enter to add one
    nl: Typ hierboven en druk op Enter om er een toe te voegen

task:
  mark_done:
    en: Mark as done
    nl: Als voltooid markeren
  mark_not_done:
    en: Mark as not done
    nl: Als niet voltooid markeren
