[package]
name = "dagr"
version = "0.2.0"
edition = "2021"
description = "A simple, priority-ordered task list with a built-in MCP server"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
rusqlite = { version = "0.40", features = ["bundled"] }
anyhow = "1"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
tokio = { version = "1", features = [
    "rt",
    "macros",
    "io-std",
    "io-util",
    "net",
    "sync",
    "time",
    "signal",
] }
libc = "0.2"
tokio-util = "0.7"
axum = "0.8"
