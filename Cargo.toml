[package]
name = "dagr"
version = "0.1.0"
edition = "2021"
description = "A simple, priority-ordered task list with a built-in MCP server"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
rusqlite = { version = "0.40", features = ["bundled"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "net"] }
tokio-util = "0.7"
axum = "0.8"
async-channel = "2"
